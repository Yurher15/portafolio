<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo interactiva · Yuri Hernández</title>
<meta name="description" content="Demostración con datos ficticios del Sistema de Inventario y del Portal de Técnicos de Soporte desarrollados por Yuri Josué Hernández.">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon-64.png">
<style>
*{box-sizing:border-box}
html,body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
body{background:#fafafa}
/* ---------- barra de la demo ---------- */
.demobar{position:sticky;top:0;z-index:70;height:46px;background:#0B2545;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font:14px "Segoe UI",system-ui,sans-serif}
.demobar img{width:30px;height:30px;border-radius:7px}
.demobar b{font:600 15px Georgia,serif;white-space:nowrap}
.demobar .sw{display:flex;gap:6px;margin-left:8px}
.demobar .sw button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:13px}
.demobar .sw button.on{background:#C9A227;border-color:#C9A227;color:#0B2545}
.demobar .sp{flex:1}
.demobar a{color:#fff;font-size:13px;white-space:nowrap}
.aviso{background:#F4ECD3;color:#5b4700;padding:6px 16px;font:13px "Segoe UI",system-ui,sans-serif;border-bottom:1px solid #e6d9a8}
/* ---------- piezas comunes ---------- */
.app{display:flex;align-items:stretch;min-height:calc(100vh - 46px)}
.sb{position:sticky;top:46px;height:calc(100vh - 46px);align-self:flex-start;flex:none;background:#0e1a2b;color:rgba(226,232,240,.85);display:flex;flex-direction:column;overflow:hidden}
.nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:#e4f3e8;color:#1c6431}.pill.bad{background:#fdecea;color:#9b1c1c}.pill.warn{background:#fff3dc;color:#7a4a00}.pill.info{background:#e7edf3;color:#123a5f}.pill.gray{background:#eef0f2;color:#454e57}
.mod{position:fixed;inset:0;background:rgba(8,14,24,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.mod>div{background:#fff;color:#222;max-width:600px;width:100%;max-height:92vh;overflow:auto;border-radius:12px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px}
.mod h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;bottom:20px;right:20px;background:#0e1a2b;color:#fff;padding:11px 16px;border-radius:10px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;font:600 13px "Segoe UI",system-ui,sans-serif}
.toast:before{content:"✓ ";color:#6fd39a}
canvas.firma{width:100%;height:120px;border:1px dashed #888;border-radius:8px;background:#fff;touch-action:none;display:block}
.sp1{flex:1}
.tw{overflow-x:auto}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dn .lg div{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:13px}.dn .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* =========== INVENTARIO =========== */
.inv{--pr:#123a5f;--prd:#0d2e4d;--prl:#e7edf3;--bg:#fafafa;--sf:#fff;--alt:#f0f0f0;--bd:#ddd;--bd2:#ccc;--tx:#222;--tx2:#777;--ac:#4c9aff;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}

.inv .cnt{display:flex;align-items:center;gap:10px;border:0;border-top:1px solid rgba(255,255,255,.09);background:none;color:rgba(226,232,240,.6);padding:13px 18px;font-size:13px;text-align:left}
.inv .cnt:hover{color:#fff}
.inv.col .cnt{justify-content:center;padding:13px 0}.inv.col .cnt span{display:none}.inv.col .cnt svg{transform:rotate(180deg)}
.inv .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.inv .tb{display:flex;align-items:center;gap:14px;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 22px;height:70px;position:sticky;top:46px;z-index:20}
.inv .tb img{height:40px;width:40px;border-radius:8px}
.inv .tb h1{flex:1;text-align:center;margin:0;font-size:20px;font-weight:600;color:var(--pr)}
.inv .tbi{display:flex;gap:6px;align-items:center}
.inv .ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--tx);display:grid;place-items:center}

.inv h2{margin:0 0 4px;font-size:20px;color:var(--pr)}

.inv .sub{color:var(--tx2);margin:0 0 16px;font-size:13px}
.inv .cd{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.inv .tl4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.inv .kp{border-radius:8px;padding:12px 14px;border:1px solid var(--bd);background:var(--sf)}
.inv .kp b{display:block;font-size:26px;line-height:1.15}.inv .kp span{font-size:12px;color:var(--tx2)}
.inv .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.inv table{width:100%;border-collapse:collapse;font-size:13px}
.inv th{background:var(--alt);text-align:left;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--bd2);white-space:nowrap}

.inv .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inv input,.inv select,.inv textarea{padding:8px 10px;border:1px solid var(--bd2);border-radius:6px;background:var(--sf);font-size:13px;min-height:36px}
.inv textarea{width:100%;resize:vertical}
.inv .bt{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;min-height:36px}
.inv .bt:hover{background:var(--prd)}.inv .bt.sec{background:var(--sf);color:var(--tx);border:1px solid var(--bd2)}.inv .bt.sec:hover{background:var(--alt)}.inv .bt.sm{padding:4px 10px;min-height:28px;font-size:12px}.inv .bt.dg{background:#a32d2d}

.inv .fm label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.inv .fm input,.inv .fm select{width:100%}
.inv .tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:12px 0;flex-wrap:wrap}
.inv .tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--tx2);font-weight:600;font-size:13px}
.inv .tabs button.on{color:var(--pr);border-bottom-color:var(--pr)}
.inv .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0;font-size:13px}.inv .kv dt{color:var(--tx2)}.inv .kv dd{margin:0}
.inv .stp{display:flex;align-items:flex-start;margin:14px 0 6px;overflow-x:auto;padding-bottom:6px}
.inv .stp div{flex:1;min-width:104px;text-align:center;position:relative;font-size:11.5px;color:var(--tx2);padding:0 4px}
.inv .stp div:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--bd2)}
.inv .stp div:first-child:before{display:none}

.inv .stp i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 5px;background:#fff;border:2px solid var(--bd2);font-style:normal;font-weight:700;font-size:12px;position:relative;z-index:1}
.inv .stp .d i{background:#1c8a4a;border-color:#1c8a4a;color:#fff}.inv .stp .n i{border-color:var(--ac);color:var(--ac);background:#eaf2fc}.inv .stp .n{color:var(--tx);font-weight:600}
.inv .sol{border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--sf)}
.inv .sol .h{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.inv .bars2{display:flex;flex-direction:column;gap:7px}
.inv .bars2 div{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.inv .bars2 span.t{background:var(--alt);border-radius:0 4px 4px 0;height:12px}.inv .bars2 span.t i{display:block;height:12px;background:#2a78d6;border-radius:0 4px 4px 0}
.inv.fake{font-size:14px}
/* =========== PORTAL =========== */
.por{--pr:#123a5f;--prd:#0d2e4d;--prs:#e7edf3;--lk:#1f5f99;--pg:#f4f6f9;--sf:#fff;--alt:#f4f6f9;--hv:#f6f8fb;--sel:#eaf2fc;--bd:#e2e6eb;--bd2:#cfd6dd;--tx:#1b2430;--tx2:#454e57;--tx3:#5b6672;--hd:#0e1a2b;--s1:#2a78d6;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--tx);background:var(--pg)}

.por .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.por .tb{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:46px;z-index:20}
.por .tb h1{margin:0;font-size:20px;color:var(--hd)}.por .tb .s{font-size:13px;color:var(--tx3)}

.por .tile .l{font-size:13px;font-weight:600;color:var(--tx3)}.por .tile .num{font-size:32px;font-weight:700;color:var(--hd);line-height:1.1}.por .tile .no{font-size:13px;color:var(--tx3)}.por .tile .no.al{color:#9b1c1c;font-weight:600}

.por .bd{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}

.por .tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

function ficha(id){
 const e=empById(id);let tab="eq";
 const m=modal(`<h3>${esc(e.n)}</h3><div class="hint">${e.p} · ${e.a} · ${e.pais} / ${e.sede}</div><dl class="kv" style="grid-template-columns:110px 1fr;margin:8px 0 0"><dt>Correo</dt><dd>${e.correo}</dd><dt>Licencia Office</dt><dd>${e.office}</dd><dt>Sociedad</dt><dd>${e.soc}</dd></dl>
 <div class="tabs" id="ft"><button data-f="eq" class="on">Equipos de cómputo (1)</button><button data-f="lin">Línea móvil</button><button data-f="sum">Suministros</button><button data-f="prg">Programas</button></div><div id="fb"></div>
 <div class="bar" style="margin:14px 0 0;justify-content:flex-end"><button class="bt sec" id="x">Cerrar</button><button class="bt" id="c" ${e.carta==="Firmada"?"disabled":""}>Generar carta de responsabilidad</button></div>`);
 const g=gar(e.gar);
 const body={
  eq:()=>`<dl class="kv"><dt>Hostname</dt><dd><b>${e.host}</b> · ${e.tipo}</dd><dt>Marca / modelo</dt><dd>${e.marca} · ${e.mod}</dd><dt>N.º de serie</dt><dd>${e.serie}</dd><dt>Procesador</dt><dd>${e.proc}</dd><dt>RAM / disco</dt><dd>${e.ram} / ${e.disco}</dd><dt>Sistema operativo</dt><dd>${e.so}</dd><dt>Activo fijo</dt><dd>${e.af}</dd><dt>Garantía</dt><dd><span class="pill ${g.c}">${g.t}</span></dd><dt>Monitoreo</dt><dd>${monPill(e.on?"En línea":"Desconectado")} <span class="hint">última conexión ${e.vis}</span></dd><dt>Carta</dt><dd>${cartaPill(e.carta)}</dd></dl>`,
  lin:()=>`<dl class="kv"><dt>Número</dt><dd>${e.tel}</dd><dt>IMEI</dt><dd>${e.imei}</dd><dt>Sello de seguridad</dt><dd>SG-${String(3000+e.id)}</dd><dt>Carta del celular</dt><dd>${cartaPill(e.id%3?"Firmada":"Pendiente")}</dd></dl>`,
  sum:()=>{const s=D.per.filter(p=>p.a===e.n);return s.length?tabla(["Suministro","N/S","Fecha","Carta"],s.map(p=>tr([p.s,p.ns,p.f,cartaPill(p.c)]))):`<p class="hint">Sin suministros entregados.</p>`},
  prg:()=>tabla(["Programa","Versión"],e.progs.map(k=>tr([D.prog[k][0],D.prog[k][1]])))+`<p class="hint">Reportado por el agente de monitoreo.</p>`};
 const pinta=()=>$("#fb",m).innerHTML=body[tab]();pinta();
 $$("#ft button",m).forEach(b=>b.onclick=()=>{tab=b.dataset.f;$$("#ft button",m).forEach(x=>x.classList.toggle("on",x===b));pinta()});
 $("#x",m).onclick=closeModal;$("#c",m).onclick=()=>cartaModal({nombre:e.n,cosa:"el equipo "+e.host+" (serie "+e.serie+")",ok:()=>{e.carta="Firmada"}});
}

/* ---------- Dashboard ---------- */
const DB={tab:"resumen",dep:"",soc:""};
INV.dashboard=()=>{
 const L=D.emp.filter(e=>(!DB.dep||e.a===DB.dep)&&(!DB.soc||e.soc===DB.soc));
 const cnt=(k,arr)=>(arr||[...new Set(L.map(e=>e[k]))]).map(v=>[v,L.filter(e=>e[k]===v).length]);
 const col=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7"];
 const dn=(arr,t)=>`<div class="cd"><h3>${t}</h3>${donut(arr.map((a,i)=>[a[1],col[i%6],a[0]]))}</div>`;
 const tabs=[["resumen","Resumen"],["equipos","Equipos de cómputo"],["celulares","Celulares"]];
 const cuerpo=DB.tab==="resumen"?`<div class="g2">${dn(cnt("pais",PAISES).filter(a=>a[1]),"Empleados por país")}${dn(cnt("a"),"Empleados por departamento")}</div>`
 :DB.tab==="equipos"?`<div class="g2">${dn(cnt("tipo"),"Equipos por tipo")}${dn(cnt("marca"),"Equipos por marca")}${dn(cnt("so"),"Sistemas operativos")}${dn([["Vigente",L.filter(e=>gar(e.gar).c==="ok").length],["Vence en ≤ 6 meses",L.filter(e=>gar(e.gar).c==="warn").length],["Vencida",L.filter(e=>gar(e.gar).c==="bad").length]],"Garantías")}</div>`
 :`<div class="g2">${dn(cnt("pais",PAISES).filter(a=>a[1]),"Celulares por país")}<div class="cd"><h3>Detalle</h3>${tabla(["Empleado","Número","IMEI"],L.map(e=>tr([e.n,e.tel,e.imei])))}</div></div>`;
 return `<h2>Dashboard</h2><p class="sub">Indicadores del inventario con filtros por departamento y sociedad.</p>
 <div class="bar"><select id="dd">${opts([...new Set(D.emp.map(e=>e.a))],DB.dep,"Todos los departamentos")}</select><select id="ds">${opts([...new Set(D.emp.map(e=>e.soc))],DB.soc,"Todas las sociedades")}</select><button class="bt sec" id="dx">Exportar a Excel</button></div>
 <div class="tl4"><div class="kp"><b>${L.length}</b><span>Empleados activos</span></div><div class="kp"><b>${L.length}</b><span>Equipos de cómputo</span></div><div class="kp"><b>${L.filter(e=>e.tel!=="—").length}</b><span>Celulares</span></div><div class="kp"><b>${D.per.length}</b><span>Periféricos</span></div><div class="kp"><b>${L.length*2+D.per.length}</b><span>Total de activos</span></div></div>
 <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${DB.tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>${cuerpo}`;
};
INVB.dashboard=()=>{$("#dd").onchange=e=>{DB.dep=e.target.value;render()};$("#ds").onchange=e=>{DB.soc=e.target.value;render()};$("#dx").onclick=()=>toast("Se generaría el archivo de Excel (simulado).");$$(".tabs [data-t]").forEach(b=>b.onclick=()=>{DB.tab=b.dataset.t;render()})};

 $("#pbell").onclick=()=>{const w=$(".tbw");const ex=$(".pnl",w);if(ex){ex.remove();return}
  const d=document.createElement("div");d.className="cd pnl";d.innerHTML=`<div class="ch"><h3>Notificaciones</h3><button class="lb" id="mk">Marcar todas como leídas</button></div>${NOTIFS.map((n,i)=>`<button class="lbt ${n[4]?"nl":""}" data-n="${i}"><span style="display:flex;flex-direction:column;gap:2px"><b>${n[0]}</b><span>${n[1]}</span><span class="mt">${n[2]}</span></span></button>`).join("")}`;w.appendChild(d);

/* ---------- Inicio ---------- */

 return `<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px"><h2 style="margin:0;font-size:24px;color:var(--hd)">Buenas tardes, ${ME.split(" ")[0]}</h2><span class="mt" style="font-size:14px">miércoles, 18 de noviembre · tu centro de trabajo del día</span></div>
 <div class="gt"><button class="tile" data-go="tickets"><span class="l">Tickets asignados abiertos</span><span class="num">${ab.length}</span><span class="no ${rk?"al":""}">${rk?rk+" con SLA vencido o por vencer":"Sin SLA en riesgo"}</span></button>
 <button class="tile" data-go="tareas"><span class="l">Tareas pendientes</span><span class="num">${pend.length}</span><span class="no">${TAREAS.filter(t=>t.e==="hecha").length+4} completadas en los últimos 7 días</span></button>
 <button class="tile" data-go="kpis"><span class="l">Mis KPI</span><span class="num">${ico(PI.kpis,30)}</span><span class="no">Resueltos, SLA, tiempos y satisfacción</span></button>
 <button class="tile" data-go="whatsapp"><span class="l">WhatsApp esperando técnico</span><span class="num">${nWa()}</span><span class="no ${nWa()?"al":""}">${nWa()?"Empleados esperando respuesta":"Nadie esperando"}</span></button></div>
 <div class="gp">
 <section class="cd"><div class="ch"><h3>Notificaciones</h3><button class="lb" data-go="tickets">Ver tickets</button></div>${NOTIFS.map(n=>`<button class="lbt ${n[4]?"nl":""}" data-go="${n[3]}"><span style="display:flex;flex-direction:column;gap:2px"><b>${n[0]}</b><span>${n[1]}</span><span class="mt">${n[2]}</span></span></button>`).join("")}</section>
 <section class="cd"><div class="ch"><h3>Tickets con SLA más próximo</h3><button class="lb" data-go="tickets">Ver todos</button></div>${[...ab].sort((a,b)=>a.h-b.h).slice(0,5).map(t=>`<button class="lbt" data-tk="${t.id}">${priB(t.pri)}<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span><span class="cod">#${t.id}</span> ${t.asunto}</span><span class="mt ${slaRk(t)?"rk":""}">${slaTxt(t)} · ${t.sol}</span></span></button>`).join("")||`<p class="vac">No tienes tickets abiertos.</p>`}</section>
 <section class="cd"><div class="ch"><h3>Mis tareas</h3><button class="lb" data-go="tareas">Ver todas</button></div>${pend.slice(0,5).map(t=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--bd)"><button class="ck" data-tr="${t.id}">${ico(PI.tareas,16)}</button><div style="flex:1;min-width:0"><div style="font-weight:500">${t.t}</div><div class="mt">${t.or} · vence ${fmtF(new Date(t.v+"T12:00"))}</div></div>${priB(t.pri)}</div>`).join("")||`<p class="vac">No tienes tareas pendientes.</p>`}</section></div>`;
};
PORB.inicio=()=>{$$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));$$("[data-tk]").forEach(b=>b.onclick=()=>{P.tkSel=+b.dataset.tk;P.tkTab="todos";go("tickets")});$$("[data-tr]").forEach(b=>b.onclick=()=>{go("tareas");fichaTarea(+b.dataset.tr)})};

/* ---------- Mis tareas ---------- */
const COLS=[["pend","Pendientes"],["prog","En progreso"],["rev","En revisión"],["hecha","Completadas"]];
POR.tareas=()=>{
 const T=[["tablero","Tablero"],["rutinas","Rutinas y preventivos"],["plantillas","Plantillas"],["asignadas","Asignadas por mí"],["aprobar","Por aprobar"]];
 const tabs=`<div class="tabs" role="group" aria-label="Vista de tareas">${T.map(t=>`<button class="tab ${P.tarTab===t[0]?"on":""}" data-tt="${t[0]}">${t[1]}${t[0]==="aprobar"&&APROB.length?` (${APROB.length})`:""}</button>`).join("")}</div>`;
 let c="";
 if(P.tarTab==="tablero")c=`<section class="cd" style="padding:16px"><div class="eb" style="margin-bottom:8px">Nueva tarea</div><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="nt" class="inp" style="flex:1 1 280px;width:auto" placeholder="Ej. Revisar UPS del cuarto de servidores"><select id="np" class="inp" style="width:auto"><option>Media</option><option>Urgente</option><option>Alta</option><option>Baja</option></select><button class="btn pri" id="add">${ico(PI.mas,16)} Agregar</button></div></section>
 <div class="kb">${COLS.map(k=>`<div class="co"><h2>${k[1]} · ${TAREAS.filter(t=>t.e===k[0]).length}</h2>${TAREAS.filter(t=>t.e===k[0]).map(t=>`<button class="tr ${t.e==="hecha"?"hc":""}" data-ft="${t.id}"><span class="tt" style="font-weight:600">${t.t}</span><span class="mt">${t.or} · vence ${fmtF(new Date(t.v+"T12:00"))}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${priB(t.pri)}${bd(t.sub.filter(s=>s[1]).length+"/"+t.sub.length+" subtareas","neu")}${t.ev.length?bd(ico(PI.clip,12)+t.ev.length,"info"):""}</span></button>`).join("")||`<p class="mt">Nada por aquí.</p>`}</div>`).join("")}</div>`;
 if(P.tarTab==="rutinas")c=`<section class="cd"><div class="ch"><h3>Rutinas y preventivos</h3><span class="mt">Se generan solas como tareas en su fecha</span></div><div class="tabla"><div class="thd" style="grid-template-columns:2fr 1.2fr 1fr 1.4fr 90px 130px"><span>Rutina</span><span>Frecuencia</span><span>Próxima</span><span>Asignada a</span><span>Estado</span><span></span></div>${RUT.map((r,i)=>`<div class="fila" style="grid-template-columns:2fr 1.2fr 1fr 1.4fr 90px 130px"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span>${bd(r[4],r[4]==="Activa"?"good":"neu")}<button class="btn sm" data-rg="${i}" ${r[4]!=="Activa"?"disabled":""}>Generar ahora</button></div>`).join("")}</div></section>`;
 if(P.tarTab==="plantillas")c=`<div class="gp">${PLT.map((p,i)=>`<section class="cd" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:15px;color:var(--hd)">${p[0]}</b>${priB(p[2])}</div><span class="mt" style="font-size:13px">${p[1]}</span><ul style="margin:0;padding-left:18px;font-size:13px;color:var(--tx2)">${p[3].map(s=>`<li>${s}</li>`).join("")}</ul><button class="btn sm" data-pl="${i}" style="align-self:flex-start">Crear tarea desde la plantilla</button></section>`).join("")}</div>`;
 if(P.tarTab==="asignadas")c=`<section class="cd"><div class="ch"><h3>Tareas abiertas que asignaste al equipo</h3></div>${ASIG.map(a=>`<div class="lbt" style="cursor:default"><span style="flex:1"><b>${a[0]}</b><br><span class="mt">Asignada a ${a[1]} · vence ${fmtF(new Date(a[3]+"T12:00"))}</span></span>${bd(a[2],a[2]==="Pendiente"?"neu":"info")}</div>`).join("")}</section>`;
 if(P.tarTab==="aprobar")c=`<section class="cd"><div class="ch"><h3>Tareas del equipo esperando tu visto bueno</h3></div>${APROB.map(a=>`<div class="lbt" style="cursor:default;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px"><b>${a.t}</b><br><span class="mt">Enviada por ${a.de} · vence ${fmtF(new Date(a.v+"T12:00"))}</span></span><button class="btn sm" data-ap="${a.id}:d">Devolver</button><button class="btn pri sm" data-ap="${a.id}:a">Aprobar</button></div>`).join("")||`<p class="vac">No hay tareas por aprobar.</p>`}</section>`;
 return tabs+c;
};
PORB.tareas=()=>{
 $$("[data-tt]").forEach(b=>b.onclick=()=>{P.tarTab=b.dataset.tt;render()});
 $$("[data-ft]").forEach(b=>b.onclick=()=>fichaTarea(+b.dataset.ft));
 const add=$("#add");if(add)add.onclick=()=>{const v=val("nt").trim();if(!v){toast("Escribe el nombre de la tarea.");return}TAREAS.push({id:Date.now(),t:v,d:"Creada desde la demo.",e:"pend",pri:val("np"),or:"Manual",v:"2026-11-30",sub:[],ev:[],obs:[]});toast("Tarea agregada. Completa su ficha con detalles y subtareas.");render()};
 $$("[data-rg]").forEach(b=>b.onclick=()=>{const r=RUT[+b.dataset.rg];TAREAS.push({id:Date.now(),t:r[0],d:"Generada desde la rutina «"+r[1]+"».",e:"pend",pri:"Media",or:"Rutina",v:"2026-11-24",sub:[["Revisión completa",false]],ev:[],obs:[]});toast("Tarea generada en el tablero.")});
 $$("[data-pl]").forEach(b=>b.onclick=()=>{const p=PLT[+b.dataset.pl];TAREAS.push({id:Date.now(),t:p[0],d:p[1],e:"pend",pri:p[2],or:"Plantilla",v:"2026-11-26",sub:p[3].map(s=>[s,false]),ev:[],obs:[]});toast("Tarea creada con sus subtareas.")});
 $$("[data-ap]").forEach(b=>b.onclick=()=>{const[id,a]=b.dataset.ap.split(":");const i=APROB.findIndex(x=>x.id==+id);APROB.splice(i,1);toast(a==="a"?"Tarea aprobada y completada.":"Tarea devuelta al técnico con tus observaciones.");render()});
};
function fichaTarea(id){
 const t=TAREAS.find(x=>x.id===id);const sig={pend:["Iniciar","prog"],prog:["Enviar a revisión","rev"],rev:["Aprobar y completar","hecha"],hecha:["Reabrir","pend"]}[t.e];
 const m=modal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="eb">${t.or}</div><h3 style="margin:2px 0 0;font-size:19px;color:var(--hd)">${esc(t.t)}</h3></div><button class="btn sm" id="x">Cerrar</button></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${priB(t.pri)}${bd(COLS.find(c=>c[0]===t.e)[1],t.e==="hecha"?"good":t.e==="rev"?"warn":"info")}${bd("Vence "+fmtF(new Date(t.v+"T12:00")),"neu")}</div>
 <div class="cs"><span class="eb">Descripción</span>${esc(t.d)}</div>
 <div><div class="eb" style="margin-bottom:6px">Subtareas</div><div id="sbs">${t.sub.map((s,i)=>`<label class="sbt ${s[1]?"dn2":""}"><input type="checkbox" data-s="${i}" ${s[1]?"checked":""}><span>${esc(s[0])}</span></label>`).join("")||`<span class="mt">Sin subtareas.</span>`}</div></div>
 <div><div class="eb" style="margin-bottom:6px">Evidencias</div><div style="display:grid;gap:8px">${t.ev.map(e=>`<div class="evd"><i>${e[1]}</i><div><b style="font-size:13px">${e[0]}</b><div class="mt">Subida por ${ME}</div></div></div>`).join("")||`<span class="mt">Aún no hay evidencias.</span>`}<button class="btn sm" id="sub" style="align-self:flex-start;justify-self:start">${ico(PI.clip,14)} Subir evidencia</button></div></div>
 <div><div class="eb" style="margin-bottom:6px">Observaciones</div>${t.obs.map(o=>`<div class="cs" style="margin-bottom:6px">${esc(o)}</div>`).join("")}<textarea class="inp" id="ob" placeholder="Escribe una observación…" style="min-height:64px"></textarea><button class="btn sm" id="oba" style="margin-top:6px">Agregar observación</button></div>
 <div class="ax" style="margin-top:auto">${t.e==="rev"?`<button class="btn" id="dev">Devolver</button>`:""}<button class="btn pri" id="mv">${sig[0]}</button></div>`,"dr");
 $("#x",m).onclick=closeModal;
 $$("[data-s]",m).forEach(c=>c.onchange=()=>{t.sub[+c.dataset.s][1]=c.checked;c.closest("label").classList.toggle("dn2",c.checked)});
 $("#sub",m).onclick=()=>{t.ev.push(["evidencia-"+(t.ev.length+1)+".png","PNG"]);toast("Evidencia adjuntada (simulado).");fichaTarea(id);render()};
 $("#oba",m).onclick=()=>{const v=val("ob").trim();if(!v){toast("Escribe la observación primero.");return}t.obs.push(v);fichaTarea(id)};
 const dv=$("#dev",m);if(dv)dv.onclick=()=>{t.e="prog";closeModal();toast("Tarea devuelta a «En progreso».");render()};
 $("#mv",m).onclick=()=>{t.e=sig[1];closeModal();toast(sig[1]==="hecha"?"Tarea completada.":sig[1]==="rev"?"Enviada a revisión de la jefatura.":"Tarea actualizada.");render()};
}

/* ---------- Tickets ---------- */
const TKTABS=[["mis","Mis abiertos",t=>t.asig===ME&&t.e!=="Resuelto"],["sin","Sin asignar",t=>!t.asig&&t.e!=="Resuelto"],["pend","Pendientes",t=>t.e==="Pendiente"],["res","Resueltos (30 días)",t=>t.e==="Resuelto"],["todos","Todos (30 días)",()=>true]];
const estB=e=>bd(e,e==="Abierto"?"info":e==="Pendiente"?"warn":"good");
POR.tickets=()=>{
 const f=TKTABS.find(x=>x[0]===P.tkTab),L=TK.filter(f[2]),t=TK.find(x=>x.id===P.tkSel);
 const cols="92px minmax(200px,2fr) minmax(150px,1.1fr) 104px 130px";
 return `<div class="tabs" role="group" aria-label="Filtrar tickets">${TKTABS.map(x=>`<button class="tab ${P.tkTab===x[0]?"on":""}" data-tt="${x[0]}">${x[1]} (${TK.filter(x[2]).length})</button>`).join("")}<span style="margin-left:auto"></span><button class="btn sm" id="act">${ico(PI.sync,15)} Actualizar</button></div>
 <div class="split"><section class="cd pn"><div class="ch"><h3>Freshservice</h3><span class="mt">${L.length} ticket(s)</span></div><div class="tabla"><div class="thd" style="grid-template-columns:${cols}"><span>Ticket</span><span>Asunto</span><span>Solicitante</span><span>Prioridad</span><span>SLA</span></div>${L.map(x=>`<button class="fila ${x.id===P.tkSel?"on":""}" data-t="${x.id}" style="grid-template-columns:${cols}"><span class="cod">#${x.id}</span><span>${x.asunto}${x.asig?"":` <span class="mt">· sin asignar</span>`}</span><span>${x.sol}<br><span class="mt">${x.sede}</span></span>${priB(x.pri)}<span class="${slaRk(x)?"rk":"mt"}">${slaTxt(x)}</span></button>`).join("")||`<p class="vac">No hay tickets en esta vista.</p>`}</div></section>
 <aside class="lt">${t?detalleTk(t):`<section class="cd" style="padding:20px"><p class="mt" style="margin:0;font-size:13px">Selecciona un ticket para ver el detalle, la conversación y el equipo del solicitante en el Inventario.</p></section>`}</aside></div>`;
};
function detalleTk(t){
 const e=t.eq?D.emp.find(x=>x.host===t.eq):null,res=t.e==="Resuelto";
 return `<section class="cd" style="padding:16px;display:flex;flex-direction:column;gap:14px"><div><div class="eb">Ticket</div><h3 style="margin:2px 0 6px;font-size:16px;color:var(--hd)"><span class="cod">#${t.id}</span> ${esc(t.asunto)}</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${estB(t.e)} ${priB(t.pri)}</div></div>
 <dl class="fi"><dt>Solicitante</dt><dd>${t.sol}</dd><dt>Sede</dt><dd>${t.sede}</dd><dt>Categoría</dt><dd>${t.cat}</dd><dt>Asignado a</dt><dd>${t.asig||"Sin asignar"}</dd><dt>SLA</dt><dd class="${slaRk(t)?"rk":""}">${slaTxt(t)}</dd><dt>Creado</dt><dd>${t.cre}</dd></dl>
 <div class="cs"><span class="eb">Equipo en Inventario</span>${e?`<b>${e.host}</b> · ${e.mod}<span class="mt">Serie ${e.serie} · ${e.on?"En línea":"Desconectado"}</span><button class="lb" id="veq" style="align-self:flex-start">Ver ficha del equipo</button>`:`<span class="mt">No registrada en Inventario</span>`}</div>
 <div class="ax">${!res&&t.asig!==ME?`<button class="btn pri sm" data-a="tomar">Tomar ticket</button>`:""}${!res&&t.e==="Abierto"?`<button class="btn sm" data-a="pend">Marcar pendiente</button>`:""}${!res&&t.e==="Pendiente"?`<button class="btn sm" data-a="abrir">Volver a abierto</button>`:""}${!res?`<button class="btn sm" data-a="res">Marcar resuelto</button>`:`<button class="btn sm" data-a="reabrir">Reabrir</button>`}<button class="btn sm" data-a="tarea">Crear tarea</button></div>
 <div><div class="eb" style="margin-bottom:6px">Conversación</div><div class="hilo">${t.hilo.map(h=>`<div class="bz ${h[0]}"><span class="m">${h[0]==="pv"?"Nota privada · ":""}${h[1]}</span>${esc(h[2])}</div>`).join("")}</div></div>
 <div><label class="lbl" for="msg">Escribir en el ticket</label><textarea class="inp" id="msg" placeholder="Nota interna o respuesta al solicitante"></textarea><div class="ax" style="margin-top:8px"><button class="btn sm" id="npv">Agregar nota privada</button><button class="btn pri sm" id="rsp">Responder al solicitante</button></div></div></section>`;
}
PORB.tickets=()=>{
 $$("[data-tt]").forEach(b=>b.onclick=()=>{P.tkTab=b.dataset.tt;render()});$$("[data-t]").forEach(b=>b.onclick=()=>{P.tkSel=+b.dataset.t;render()});
 $("#act").onclick=()=>toast("Tickets actualizados desde Freshservice (simulado).");
 const t=TK.find(x=>x.id===P.tkSel);if(!t)return;
 const v=$("#veq");if(v)v.onclick=()=>{P.invSel=t.eq;go("inventario")};
 $$("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a==="tarea"){TAREAS.push({id:Date.now(),t:"Ticket #"+t.id+": "+t.asunto,d:"Tarea creada desde el ticket.",e:"pend",pri:t.pri,or:"Ticket #"+t.id,v:"2026-11-20",sub:[],ev:[],obs:[]});toast("Tarea creada desde #"+t.id+".");render();return}
  if(a==="tomar"){t.asig=ME;toast("Ticket #"+t.id+" asignado a ti (simulado).")}
  if(a==="pend"){t.e="Pendiente";toast("Ticket en pendiente (simulado).")}
  if(a==="abrir"){t.e="Abierto"}
  if(a==="res"){t.e="Resuelto";KP.mes.res++;KP.sem.res++;toast("Ticket #"+t.id+" resuelto; se sumó a tus KPI (simulado).")}
  if(a==="reabrir"){t.e="Abierto";toast("Ticket reabierto.")}
  render()});
 $("#npv").onclick=()=>{const x=val("msg").trim();if(!x){toast("Escribe la nota primero.");return}t.hilo.push(["pv",ME,x]);render()};
 $("#rsp").onclick=()=>{const x=val("msg").trim();if(!x){toast("Escribe la respuesta primero.");return}t.hilo.push(["sa",ME,x]);toast("Respuesta enviada a "+t.sol+" (simulado).");render()};
};

/* ---------- Inventario (portal) ---------- */
function eqLista(){return D.emp.map(e=>({host:e.host,mod:e.mod,serie:e.serie,asig:e.n,est:"En Uso",on:e.on,vis:e.vis,e,sede:e.sede,gar:e.gar})).concat(D.disp.filter(d=>d.e==="En Bodega").map(d=>({host:d.host,mod:d.m,serie:d.ser,asig:"Sin asignar",est:"En Bodega",on:null,vis:"—",e:null,sede:d.pais+" · bodega",gar:"2028-06"})))}
POR.inventario=()=>{
 const q=sinAc(P.invQ),L=eqLista().filter(x=>(P.invF==="todos"||(P.invF==="uso"?x.est==="En Uso":P.invF==="bod"?x.est==="En Bodega":x.on===false))&&sinAc(x.asig+x.serie+x.mod+x.host).includes(q));
 const s=eqLista().find(x=>x.host===P.invSel),cols="130px minmax(170px,1.3fr) minmax(150px,1.2fr) 100px 120px";
 return `<div class="tabs">${[["todos","Todos"],["uso","En uso"],["bod","En bodega"],["off","Sin conexión"]].map(t=>`<button class="tab ${P.invF===t[0]?"on":""}" data-f="${t[0]}">${t[1]}</button>`).join("")}<input id="iq" class="inp" style="flex:1 1 260px;width:auto" placeholder="Buscar por empleado, serie, modelo o hostname" value="${esc(P.invQ)}"></div>
 <div class="split"><section class="cd pn"><div class="ch"><h3>Equipos</h3><span class="mt">Fuente: Inventario</span></div><div class="tabla"><div class="thd" style="grid-template-columns:${cols}"><span>Equipo</span><span>Asignado a</span><span>Sede</span><span>Estado</span><span>Conexión</span></div>${L.map(x=>`<button class="fila ${x.host===P.invSel?"on":""}" data-h="${x.host}" style="grid-template-columns:${cols}"><span class="cod">${x.host}</span><span>${x.asig}<br><span class="mt">${x.mod}</span></span><span>${x.sede}</span>${bd(x.est,x.est==="En Uso"?"good":"info")}<span class="${x.on===false?"rk":"mt"}">${x.on==null?"—":x.on?"En línea":"Desconectado"}</span></button>`).join("")||`<p class="vac">No hay equipos que coincidan.</p>`}</div></section>
 <aside class="lt">${s?`<section class="cd" style="padding:16px;display:flex;flex-direction:column;gap:14px"><div><div class="eb">Equipo</div><h3 style="margin:2px 0 0;font-size:17px;color:var(--hd)">${s.host}</h3><span class="mt">${s.mod}</span></div><dl class="fi"><dt>Serie</dt><dd>${s.serie}</dd><dt>Asignado a</dt><dd>${s.asig}</dd><dt>Departamento</dt><dd>${s.e?s.e.a:"—"}</dd><dt>Procesador</dt><dd>${s.e?s.e.proc:"—"}</dd><dt>RAM / Disco</dt><dd>${s.e?s.e.ram+" / "+s.e.disco:"—"}</dd><dt>Sistema</dt><dd>${s.e?s.e.so:"—"}</dd><dt>Activo fijo</dt><dd>${s.e?s.e.af:"—"}</dd><dt>Garantía hasta</dt><dd>${s.gar}</dd><dt>Última conexión</dt><dd>${s.vis}</dd></dl>
 <div class="cs"><span class="eb">Tickets abiertos del usuario</span>${TK.filter(t=>s.e&&t.sol===s.e.n&&t.e!=="Resuelto").map(t=>`<span><span class="cod">#${t.id}</span> ${t.asunto}</span>`).join("")||`<span class="mt">Sin tickets abiertos.</span>`}</div>
 <p class="mt" style="margin:0">Asignaciones, cartas, bodega, visitas y diagnósticos se gestionan en el sistema de Inventario.</p><button class="btn sm" id="abrir" style="align-self:flex-start">${ico(PI.externo,14)} Abrir Inventario</button></section>`:`<section class="cd" style="padding:20px"><p class="mt" style="margin:0">Selecciona un equipo para ver su ficha, su monitoreo y los tickets abiertos del usuario.</p></section>`}</aside></div>`;
};
PORB.inventario=()=>{$$("[data-f]").forEach(b=>b.onclick=()=>{P.invF=b.dataset.f;render()});$$("[data-h]").forEach(b=>b.onclick=()=>{P.invSel=b.dataset.h;render()});
 const q=$("#iq");q.oninput=e=>{P.invQ=e.target.value;const p=e.target.selectionStart;render();const n=$("#iq");n.focus();n.setSelectionRange(p,p)};
 const a=$("#abrir");if(a)a.onclick=()=>{const s=eqLista().find(x=>x.host===P.invSel);BQ.tab="serie";BQ.q=s.serie;BQ.pais="";view.inv="busqueda";setSys("inv")}};

/* ---------- Tiendas / VMI ---------- */
const sitioVista=k=>()=>{
 const L=SITIOS[k],i=Math.min(P.sit[k],L.length-1),s=L[i],cols="minmax(160px,1.4fr) minmax(140px,1.1fr) 110px minmax(130px,1fr) 70px";
 return `<div class="tabs"><button class="btn pri sm" id="sn">${ico(PI.mas,14)} Nuevo sitio</button><span class="mt">${L.length} sitios · ${L.filter(x=>x.act).length} activos</span></div>
 <div class="split"><section class="cd pn"><div class="tabla"><div class="thd" style="grid-template-columns:${cols}"><span>Sitio</span><span>Responsable</span><span>Teléfono</span><span>Internet</span><span>Equipos</span></div>${L.map((x,j)=>`<button class="fila ${j===i?"on":""}" data-si="${j}" style="grid-template-columns:${cols}"><span><b class="cod">${x.n}</b><br>${bd(x.act?"Activa":"Inactiva",x.act?"good":"neu")}</span><span>${x.resp}</span><span>${x.tel}</span><span>${x.prov}<br><span class="mt">${x.ids}</span></span><span>${x.eq.length}</span></button>`).join("")}</div></section>
 <aside class="lt"><section class="cd" style="padding:16px;display:flex;flex-direction:column;gap:14px"><div><div class="eb">${k==="tiendas"?"Tienda":"Bodega VMI"}</div><h3 style="margin:2px 0 0;font-size:17px;color:var(--hd)">${s.n}</h3></div>
 <dl class="fi"><dt>Dirección</dt><dd>${s.dir}</dd><dt>Horario</dt><dd>${s.hor}</dd><dt>Responsable</dt><dd>${s.resp} · ${s.tel}</dd><dt>Contacto alterno</dt><dd>${s.alt}</dd><dt>Proveedor</dt><dd>${s.prov}</dd><dt>ID de servicio</dt><dd>${s.ids}</dd><dt>IP pública / fija</dt><dd>${s.ip}</dd></dl>
 <div><div class="eb" style="margin-bottom:6px">Equipo del sitio</div>${s.eq.map(q=>`<div class="lbt" style="cursor:default;border-top:1px solid var(--bd);padding:8px 0;background:none"><span style="flex:1"><b>${q[0]}</b> · ${q[1]}</span><span class="mt">${q[2]}</span></div>`).join("")}</div>
 <div class="ax"><button class="btn sm" id="se">Editar sitio</button><button class="btn sm" id="st">Crear tarea</button></div></section></aside></div>`};
POR.tiendas=sitioVista("tiendas");POR.vmi=sitioVista("vmi");
const sitioBind=k=>()=>{
 $$("[data-si]").forEach(b=>b.onclick=()=>{P.sit[k]=+b.dataset.si;render()});const L=SITIOS[k],s=L[Math.min(P.sit[k],L.length-1)];
 $("#st").onclick=()=>{TAREAS.push({id:Date.now(),t:"Visita a "+s.n,d:"Revisión de red y equipos del sitio.",e:"pend",pri:"Media",or:"Sitio",v:"2026-11-27",sub:[["Revisar red",false],["Revisar equipos",false]],ev:[],obs:[]});toast("Tarea creada para "+s.n+".")};
 const form=(tit,x)=>{const m=modal(`<h3 style="color:var(--hd)">${tit}</h3><div class="fr" style="padding:0;grid-template-columns:1fr 1fr">${[["n","Nombre"],["resp","Responsable"],["tel","Teléfono"],["prov","Proveedor de Internet"],["ids","ID de servicio"],["dir","Dirección"]].map(c=>`<div><label class="lbl">${c[1]}</label><input class="inp" data-k="${c[0]}" value="${esc(x[c[0]]||"")}"></div>`).join("")}</div><div class="ax" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="x">Cancelar</button><button class="btn pri" id="ok">Guardar</button></div>`);$("#x",m).onclick=closeModal;$("#ok",m).onclick=()=>{const o={};$$("[data-k]",m).forEach(i=>o[i.dataset.k]=i.value);if(!o.n.trim()){toast("Escribe el nombre del sitio.");return}if(x===s)Object.assign(s,o);else{L.push(Object.assign({alt:"—",hor:"L-S 09:00 a 18:00",ip:"Dinámica",eq:[["Router","Router principal","RT-NUEVO"]],act:true},o));P.sit[k]=L.length-1}closeModal();toast("Datos guardados (simulado).");render()}};
 $("#se").onclick=()=>form("Editar sitio",s);$("#sn").onclick=()=>form("Nuevo sitio",{});
};
PORB.tiendas=sitioBind("tiendas");PORB.vmi=sitioBind("vmi");

/* ---------- Mis KPI ---------- */
POR.kpis=()=>{
 const k=KP[P.kpi],T=(l,n,no)=>`<div class="tile" style="cursor:default"><span class="l">${l}</span><span class="num">${n}</span>${no?`<span class="no">${no}</span>`:""}</div>`;
 const abiertos=TK.filter(t=>t.asig===ME&&t.e==="Abierto").length,pend=TK.filter(t=>t.asig===ME&&t.e==="Pendiente").length,atr=TK.filter(t=>t.asig===ME&&t.e!=="Resuelto"&&t.h<0).length;
 const ind=[["Resueltos",k.res,"—",true],["SLA %",k.sla+" %","≥ 90 %",k.sla>=90],["Resolución (h)",k.rh,"≤ 6 h",k.rh<=6],["CSAT",k.cs+" / 5","≥ 4.5",k.cs>=4.5],["Tareas a tiempo %",k.ati+" %","≥ 90 %",k.ati>=90],["Devolución %",Math.round(k.dev/k.asg*100)+" %","≤ 10 %",k.dev/k.asg<=.1]];
 const sec=(t,tiles)=>`<section class="cd"><div class="ch"><h3>${t}</h3></div><div class="gt" style="padding:0 16px 16px">${tiles}</div></section>`;
 return `<div class="tabs">${Object.entries(KP).map(([id,v])=>`<button class="chip ${P.kpi===id?"on":""}" data-p="${id}">${v.t}</button>`).join("")}<span style="margin-left:auto"></span><button class="btn sm" id="sy">${ico(PI.sync,15)} Sincronizar ahora</button></div>
 ${sec("Tickets de Freshservice · desempeño del periodo",T("Resueltos",k.res)+T("SLA %",k.sla+" %")+T("Resolución (h)",k.rh)+T("CSAT",k.cs+" / 5"))}
 ${sec("Tickets de Freshservice · carga actual",T("Abiertos",abiertos,"Ahora mismo, sin importar el periodo")+T("Pendientes",pend)+T("Atrasados",atr,atr?"Requieren atención":""))}
 ${sec("Tareas y visitas · desempeño del periodo",T("Asignadas",k.asg)+T("Completadas",k.com)+T("A tiempo %",k.ati+" %")+T("Devolución %",Math.round(k.dev/k.asg*100)+" %")+T("Visitas",k.vis))}
 ${sec("Tareas · carga actual",T("Abiertas",nTar())+T("En revisión",TAREAS.filter(t=>t.e==="rev").length)+T("Atrasadas",TAREAS.filter(t=>t.e!=="hecha"&&t.v<"2026-11-18").length))}
 <section class="cd"><div class="ch"><h3>Resueltos por día · ${k.t.toLowerCase()}</h3></div><div class="brs">${[["Lun",8],["Mar",11],["Mié",9],["Jue",13],["Vie",10]].map((d,i)=>`<div class="bc"><span>${d[1]+(i===4?KP.mes.res-46:0)}</span><i style="height:${(d[1]+(i===4?KP.mes.res-46:0))/14*100}%"></i></div>`).join("")}</div><div class="etq">${["Lun","Mar","Mié","Jue","Vie"].map(d=>`<span>${d}</span>`).join("")}</div></section>
 <section class="cd"><div class="ch"><h3>Indicadores contra metas</h3></div><div class="tabla"><div class="thd" style="grid-template-columns:1.6fr 1fr 1fr 110px"><span>Indicador</span><span>Valor</span><span>Meta</span><span></span></div>${ind.map(r=>`<div class="fila" style="grid-template-columns:1.6fr 1fr 1fr 110px"><b>${r[0]}</b><span>${r[1]}</span><span class="mt">${r[2]}</span>${r[2]==="—"?"":bd(r[3]?"Cumple":"No cumple",r[3]?"good":"crit")}</div>`).join("")}</div></section>
 <section class="cd"><div class="ch"><h3>Comparativo del equipo (vista de jefatura)</h3></div><div class="tabla"><div class="thd" style="grid-template-columns:1.6fr repeat(5,1fr)"><span>Técnico</span><span>Resueltos</span><span>SLA %</span><span>Resolución (h)</span><span>CSAT</span><span>Tareas a tiempo %</span></div>${EQP.map(r=>`<div class="fila" style="grid-template-columns:1.6fr repeat(5,1fr)"><b>${r[0]}</b><span>${r[0]===ME?k.res:r[1]}</span><span>${r[2]} %</span><span>${r[3]}</span><span>${r[4]}</span><span>${r[5]} %</span></div>`).join("")}</div></section>`;
};
PORB.kpis=()=>{$$("[data-p]").forEach(b=>b.onclick=()=>{P.kpi=b.dataset.p;render()});$("#sy").onclick=()=>toast("Indicadores sincronizados con Freshservice (simulado).")};

/* ---------- Asistente WhatsApp ---------- */
const WAT=[["esp","Esperando técnico"],["mis","Mis conversaciones"],["bot","Con el bot"],["todas","Todas"],["cer","Cerradas"]];
const waE={esp:["Esperando técnico","warn"],tec:["Con técnico","info"],bot:["Atendida por el bot","neu"],cer:["Cerrada","good"]};
POR.whatsapp=()=>{
 const f=P.waTab,L=CONV.filter(c=>f==="todas"||(f==="mis"?c.e==="tec":c.e===f)),c=CONV.find(x=>x.id===P.waSel);
 return `<div class="wab"><b>El portal está en modo de pruebas:</b> los mensajes del bot y de los técnicos se guardan aquí pero no se envían a WhatsApp. El envío real se activa al conectar la cuenta de WhatsApp Business (Meta).</div>
 <div class="gt"><div class="tile" style="cursor:default"><span class="l">Esperando técnico</span><span class="num">${nWa()}</span><span class="no ${nWa()?"al":""}">Requieren atención</span></div><div class="tile" style="cursor:default"><span class="l">Con técnico ahora</span><span class="num">${CONV.filter(x=>x.e==="tec").length}</span></div><div class="tile" style="cursor:default"><span class="l">Conversaciones hoy</span><span class="num">${CONV.length+9}</span></div><div class="tile" style="cursor:default"><span class="l">Resueltas por el bot hoy</span><span class="num">${CONV.filter(x=>x.e==="cer").length+6}</span></div></div>
 <div class="tabs">${WAT.map(t=>`<button class="tab ${f===t[0]?"on":""}" data-w="${t[0]}">${t[1]} (${CONV.filter(x=>t[0]==="todas"||(t[0]==="mis"?x.e==="tec":x.e===t[0])).length})</button>`).join("")}<span style="margin-left:auto"></span><button class="btn sm" id="probar">Probar como empleado</button></div>
 <div class="split"><section class="cd pn" style="flex-basis:380px;flex-grow:1">${L.map(x=>`<button class="lbt ${x.id===P.waSel?"on":""}" data-c="${x.id}"><span style="flex:1;min-width:0"><b>${x.n}</b><br><span class="mt">${x.tel} · ${x.pais}</span><br><span class="mt" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.m[x.m.length-1][1])}</span></span>${bd(waE[x.e][0],waE[x.e][1])}</button>`).join("")||`<p class="vac">No hay conversaciones en esta vista.</p>`}</section>
 <aside class="lt" style="flex-basis:420px">${c?`<section class="cd" style="padding:16px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="eb">Conversación</div><h3 style="margin:2px 0;font-size:16px;color:var(--hd)">${c.n}</h3><span class="mt">${c.tel}</span></div>${bd(waE[c.e][0],waE[c.e][1])}</div>
 <div class="cs"><span class="eb">Resumen del bot</span><span style="font-size:13px">${esc(c.res)}</span><span class="mt">${c.tk?"Ticket "+c.tk:"Sin ticket"}</span></div>
 <div class="hilo">${c.m.map(m=>`<div class="bz ${m[0]==="en"?"en":m[0]==="bot"?"bot":"sa"}"><span class="m">${m[0]==="en"?"Empleado":m[0]==="bot"?"Asistente (bot)":"Técnico"}</span>${esc(m[1])}</div>`).join("")}</div>
 <div class="ax">${c.e==="esp"||c.e==="bot"?`<button class="btn pri sm" data-wa="tomar">Tomar conversación</button>`:""}${c.e==="tec"?`<button class="btn sm" data-wa="bot">Devolver al bot</button>`:""}${!c.tk&&c.e!=="cer"?`<button class="btn sm" data-wa="tk">Crear ticket en Freshservice</button>`:""}${c.e!=="cer"?`<button class="btn sm" data-wa="cer">Cerrar conversación</button>`:""}</div>
 ${c.e==="tec"?`<div><label class="lbl" for="wm">Mensaje</label><textarea class="inp" id="wm" placeholder="Escribe una respuesta…" style="min-height:64px"></textarea><button class="btn pri sm" id="wsend" style="margin-top:8px">Enviar</button></div>`:`<div class="ibx">${c.e==="cer"?"Conversación cerrada.":c.e==="bot"?"El bot está atendiendo esta conversación.":"El bot escaló esta conversación. Tómala para responder."}</div>`}</section>`:`<section class="cd" style="padding:20px"><p class="mt" style="margin:0">Selecciona una conversación para verla. Las que esperan técnico aparecen primero en el filtro «Esperando técnico».</p></section>`}</aside></div>`;
};
PORB.whatsapp=()=>{
 $$("[data-w]").forEach(b=>b.onclick=()=>{P.waTab=b.dataset.w;render()});$$("[data-c]").forEach(b=>b.onclick=()=>{P.waSel=+b.dataset.c;render()});
 $("#probar").onclick=probarBot;const c=CONV.find(x=>x.id===P.waSel);if(!c)return;
 $$("[data-wa]").forEach(b=>b.onclick=()=>{const a=b.dataset.wa;
  if(a==="tomar"){c.e="tec";c.m.push(["sa","Hola, soy "+ME.split(" ")[0]+" de Soporte Técnico. Ya estoy con tu caso."]);toast("Conversación tomada (simulado).")}
  if(a==="bot"){c.e="bot";toast("Conversación devuelta al bot.")}
  if(a==="cer"){c.e="cer";toast("Conversación cerrada.")}
  if(a==="tk"){const id=3200+TK.length;TK.unshift({id,asunto:"Reportado por WhatsApp: "+c.m[0][1].slice(0,50),sol:c.n,sede:c.pais,cat:"WhatsApp",pri:"Media",e:"Abierto",asig:ME,h:6,eq:null,cre:"Ahora",hilo:[["en",c.n,c.m[0][1]]]});c.tk="#"+id;toast("Ticket #"+id+" creado en Freshservice (simulado).")}
  render()});
 const s=$("#wsend");if(s)s.onclick=()=>{const v=val("wm").trim();if(!v){toast("Escribe el mensaje primero.");return}c.m.push(["sa",v]);render()};
};
function probarBot(){
 const msgs=[["bot","¡Hola! Soy el asistente de Soporte Técnico. ¿En qué te ayudo?"]];let paso="menu";
 const m=modal(`<h3 style="color:var(--hd)">Probar como empleado</h3><p class="mt" style="margin:0 0 10px">Así conversa el bot por WhatsApp. Lo que elijas aparecerá en la bandeja del portal.</p><div class="ph" id="ph"></div><div class="ax" id="qk" style="margin-top:10px"></div><div class="ax" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="x">Cerrar</button></div>`);
 const pinta=()=>{const ph=$("#ph",m);ph.innerHTML=msgs.map(x=>`<div class="bz ${x[0]==="me"?"me":"bot"}">${esc(x[1])}</div>`).join("");ph.scrollTop=ph.scrollHeight;
  const o=paso==="menu"?["Reportar una falla","Estado de mi ticket","Hablar con un técnico"]:paso==="tipo"?["Internet / VPN","Equipo lento","Impresora"]:[];
  $("#qk",m).innerHTML=o.map(t=>`<button class="btn sm">${t}</button>`).join("");
  $$("#qk button",m).forEach(b=>b.onclick=()=>{const t=b.textContent;msgs.push(["me",t]);
   if(paso==="menu"){
    if(t==="Reportar una falla"){msgs.push(["bot","¿Qué tipo de falla es?"]);paso="tipo"}
    else if(t==="Estado de mi ticket"){msgs.push(["bot","Tienes 1 caso abierto: #3189 · Impresora del segundo nivel (abierto)."])}
    else{msgs.push(["bot","Te paso con un técnico de tu país. Un momento, por favor."]);CONV.unshift({id:Date.now(),n:"Empleado de prueba",tel:"+502 5000-0000",pais:"Guatemala",e:"esp",tk:null,res:"El empleado pidió hablar con un técnico desde el menú del bot.",m:[["en","Hablar con un técnico"],["bot","Te paso con un técnico de tu país."]]});toast("La conversación aparece en «Esperando técnico».");P.waTab="esp"}}
   else if(paso==="tipo"){const id=3200+TK.length;TK.unshift({id,asunto:t+" (reportado por WhatsApp)",sol:"Empleado de prueba",sede:"Guatemala",cat:"WhatsApp",pri:"Media",e:"Abierto",asig:null,h:4,eq:null,cre:"Ahora",hilo:[["en","Empleado de prueba","Reporte por WhatsApp: "+t]]});msgs.push(["bot","Listo, creé el ticket #"+id+". Un técnico te contactará pronto."]);paso="menu";toast("Ticket #"+id+" creado; está en «Sin asignar».")}
   pinta()})};
 pinta();$("#x",m).onclick=()=>{closeModal();render()};
}
</script>
<script>render();</script>
